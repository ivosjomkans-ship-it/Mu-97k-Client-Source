
# Build MU Online 0.97k Windows Client

name: build-windows

on:
  push:
    branches: [ "fase/*", "platform/**", "main" ]
  pull_request:
    branches: [ "fase/*", "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cmake:
    name: cmake (${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [ Debug, Release ]

    steps:
      - uses: actions/checkout@v4

      - name: Check CMake sources
        run: python .github/scripts/check_cmake_sources.py

      - name: Configure
        run: cmake -S . -B build -A Win32 -T v143

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel -- /v:minimal

      - name: Upload client
        uses: actions/upload-artifact@v4
        with:
          name: mu97k-cmake-${{ matrix.config }}
          path: |
            bin/Client/main.exe
            bin/Client/main.map
            bin/Client/Data/
            bin/Client/config.ini
          if-no-files-found: warn

  msbuild:
    name: msbuild (${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [ Debug, Release ]

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build client
        run: msbuild mu97k.sln /m /v:minimal /p:Configuration=${{ matrix.config }} /p:Platform=Win32

      - name: Upload client
        uses: actions/upload-artifact@v4
        with:
          name: mu97k-msbuild-${{ matrix.config }}
          path: |
            bin/Client/main.exe
            bin/Client/main.map
            bin/Client/Data/
            bin/Client/config.ini
          if-no-files-found: warn
